# Run the whole stack: docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8000
      MONGO_URI: mongodb://mongo:27017/interview-coach
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CLIENT_URL: http://localhost:3000
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongo-data:
